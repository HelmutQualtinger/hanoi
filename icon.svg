<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1c2a1f"/>
      <stop offset="60%" stop-color="#0d1712"/>
      <stop offset="100%" stop-color="#05090a"/>
    </radialGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a9885a"/>
      <stop offset="50%" stop-color="#d9b26a"/>
      <stop offset="100%" stop-color="#8f7343"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- dais -->
  <ellipse cx="256" cy="404" rx="168" ry="26" fill="#16241c"/>
  <ellipse cx="256" cy="392" rx="150" ry="22" fill="#203524"/>

  <!-- pillar -->
