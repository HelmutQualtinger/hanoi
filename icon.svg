  <ellipse cx="256" cy="368" rx="118" ry="20" fill="#e0864a"/>

  <ellipse cx="256" cy="332" rx="98" ry="24" fill="#d8a93a"/>
  <ellipse cx="256" cy="332" rx="98" ry="18" fill="#e2bb54"/>

  <ellipse cx="256" cy="298" rx="78" ry="22" fill="#1f9d63"/>
  <ellipse cx="256" cy="298" rx="78" ry="16" fill="#33b378"/>

  <ellipse cx="256" cy="266" rx="58" ry="20" fill="#2f6fdb"/>
  <ellipse cx="256" cy="266" rx="58" ry="14" fill="#4d87e8"/>

  <ellipse cx="256" cy="236" rx="38" ry="18" fill="#8b5fbf"/>
  <ellipse cx="256" cy="236" rx="38" ry="12" fill="#a67fd4"/>

  <!-- cap -->
